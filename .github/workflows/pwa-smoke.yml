name: PWA smoke tests

on:
  push:
    branches: [main, v1.3-development, v1.4-redesign, feature/prosody-corpus-import]
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "data/poetry-archive/**"
      - "tests/**"
      - "poems*.js"
      - "pinned.js"
      - "sw.js"
      - "package.json"
      - ".github/workflows/pwa-smoke.yml"
  pull_request:
    branches: [main, v1.3-development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npm run test:pwa
