name: V1.8 stages 3-5 prosody, search and independent pages

on:
  push:
    branches: [feature/prosody-corpus-import]
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "data/poetry-archive/**"
      - "tests/**"
      - "poems*.js"
      - "pinned.js"
      - "sw.js"
      - "package.json"
      - ".github/workflows/v18-stage3-4.yml"
  pull_request:
    branches: [main, feature/v18-stage-1-audit]
  workflow_dispatch:

concurrency:
  group: v18-stage3-5-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prosody-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/v18-prosody-search.spec.js tests/v18-prosody-corpus.spec.js tests/v18-taxonomy-archive.spec.js
