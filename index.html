<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171512"><title>یک استکان شعر</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#171512;--panel:#211d19;--panel2:#29231d;--text:#f1e8dc;--muted:#b5a697;--gold:#d5a66f;--line:#40362d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#3a2b20,transparent 55%),var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh}header{text-align:center;padding:42px 18px 22px}header .cup{font-size:38px}h1{font-size:clamp(27px,6vw,38px);font-weight:500;margin:4px 0;color:#f4dfc5}header p{color:var(--muted);margin:8px auto 0;max-width:520px;font-size:14px;line-height:2}main{width:min(940px,100%);margin:auto;padding:0 16px 48px}.pinned{display:block;text-decoration:none;color:#f5dfc2;background:linear-gradient(120deg,#493321,#2b2119);border:1px solid #80603f;border-radius:16px;padding:16px 18px;margin:8px auto 20px;max-width:680px;text-align:center}.pinned strong{display:block;font-size:17px;font-weight:500}.pinned span{font-size:12px;color:#d2b18b}.search{margin:8px auto 16px;max-width:620px}.search input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:30px;padding:13px 18px;color:var(--text);font:inherit;outline:none}.search input:focus{border-color:var(--gold)}.primary,.topics{display:flex;gap:8px;overflow:auto;padding:3px 1px 14px;scrollbar-width:none;justify-content:center}.primary button,.topics button{white-space:nowrap;border:1px solid var(--line);border-radius:22px;background:transparent;color:var(--muted);padding:8px 18px;font:inherit;font-size:13px;cursor:pointer}.primary button{font-size:15px;padding:9px 26px}.primary button.active,.topics button.active{background:var(--gold);border-color:var(--gold);color:#21170f}.section-note{text-align:center;color:var(--muted);font-size:12px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:13px}.entry{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:17px;padding:19px 17px 13px;display:flex;flex-direction:column;min-height:170px}.category{font-size:11px;color:var(--gold);margin-bottom:9px}.verse{white-space:pre-line;text-align:center;line-height:2.2;font-size:15px;font-weight:300;flex:1}.author{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 5px}.copy{align-self:center;border:0;background:transparent;color:var(--gold);font:inherit;font-size:12px;padding:5px 12px;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:40px 8px}.pinned-view{max-width:760px;margin:0 auto 28px}.pinned-view[hidden]{display:none}.pinned-item{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}.pinned-kind{font-size:11px;color:var(--gold);margin-bottom:10px}.pinned-body{white-space:pre-line;text-align:center;line-height:2.25;font-size:15px;font-weight:300}.pinned-author{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}.pinned-link{display:block;text-align:center;color:var(--gold);margin-top:12px}.back{display:block;margin:0 auto 14px;border:1px solid var(--line);border-radius:22px;background:transparent;color:var(--text);padding:8px 18px;font:inherit;cursor:pointer}footer{text-align:center;color:#8e7c6b;font-size:12px;padding:10px 15px 30px}
</style></head><body><header><div class="cup">☕</div><h1>یک استکان شعر</h1><p>گاهی یک فنجان چای و چند بیت شعر، حالِ دل را عوض می‌کند…<br>بفرمایید؛ این استکان شعر مهمان شماست.</p></header>
<main><a class="pinned" href="#pinned" id="pinned"><strong>✦ پیشنهاد‌ومیض</strong><span>مجموعهٔ ویژه و سنجاق‌شده</span></a>
<div id="regularView"><div class="search"><input id="search" type="search" placeholder="جست‌وجو در متن‌ها، شعرها و نام شاعران…" aria-label="جست‌وجو"></div>
<nav class="primary" id="sections" aria-label="بخش‌های اصلی"><button class="active" data-section="poems">اشعار</button><button data-section="texts">متون</button></nav>
<p class="section-note" id="sectionNote">اشعار بر اساس موضوع دسته‌بندی شده‌اند.</p><nav class="topics" id="topics" aria-label="دسته‌بندی موضوعی"></nav>
<section class="grid" id="entries"></section><div class="empty" id="empty" hidden>موردی در این دسته یا با این عبارت پیدا نشد.</div></div>
<div class="pinned-view" id="pinnedView" hidden><button class="back" id="backFromPinned">بازگشت به مجموعه</button><section id="pinnedEntries"></section></div></main>
<footer>یک استکان شعر · برای لحظه‌های مکث و خواندن</footer>
<script src="poems.js"></script><script src="pinned.js"></script>
<script>
const topicMap={
 poems:["همه","عاشقانه و دلدادگی","فراق و دلتنگی","تنهایی و غربت","رنج و دل‌شکستگی","امید و تاب‌آوری","عرفان و معنویت","حکمت و اخلاق","اجتماعی و انتقادی","طنز و لطافت","مرگ و گذر عمر"],
 texts:["همه","مذهبی و آیینی","تاریخی و روایی","اخلاقی و تربیتی","معرفتی و اعتقادی","ادبی و تأملی","اجتماعی"]
};
const entries=window.poemEntries||[];
topicMap.poems=["همه",...new Set(entries.filter(x=>x.section==="poems").flatMap(x=>x.tags))];
let section="poems",topic=0;const el=id=>document.getElementById(id);
function buildTopics(){el("topics").innerHTML="";topicMap[section].forEach((name,i)=>{const b=document.createElement("button");b.textContent=name;b.className=i===topic?"active":"";b.onclick=()=>{topic=i;render()};el("topics").appendChild(b)})}
function render(){buildTopics();el("sectionNote").textContent=section==="poems"?"اشعار بر اساس موضوع دسته‌بندی شده‌اند.":"متون بر اساس موضوع دسته‌بندی خواهند شد.";const q=el("search").value.trim().toLocaleLowerCase("fa");const root=el("entries");root.innerHTML="";let count=0;entries.forEach(x=>{if(x.section!==section)return;if(topic&&!x.tags.includes(topicMap[section][topic]))return;if(q&&!(x.body+" "+(x.author||"")+" "+x.tags.join(" ")).toLocaleLowerCase("fa").includes(q))return;count++;const card=document.createElement("article");card.className="entry";const cat=document.createElement("div");cat.className="category";cat.textContent=x.tags.join(" · ");const body=document.createElement("div");body.className="verse";body.textContent=x.body;card.append(cat,body);if(x.author){const author=document.createElement("div");author.className="author";author.textContent="— "+x.author;card.append(author)}const btn=document.createElement("button");btn.className="copy";btn.textContent="کپی";btn.onclick=async()=>{try{await navigator.clipboard.writeText(x.body+(x.author?"\n— "+x.author:""));btn.textContent="کپی شد ✓";setTimeout(()=>btn.textContent="کپی",1300)}catch(e){btn.textContent="امکان کپی نیست"}};card.append(btn);root.append(card)});el("empty").hidden=count!==0}
document.querySelectorAll("#sections button").forEach(b=>b.onclick=()=>{section=b.dataset.section;topic=0;document.querySelectorAll("#sections button").forEach(x=>x.classList.toggle("active",x===b));render()});
el("search").addEventListener("input",render);
function showPinned(){el("regularView").hidden=true;el("pinnedView").hidden=false;el("pinnedEntries").innerHTML="";(window.pinnedEntries||[]).forEach(x=>{const card=document.createElement("article");card.className="pinned-item";const kind=document.createElement("div");kind.className="pinned-kind";kind.textContent=x.kind;const body=document.createElement("div");body.className="pinned-body";body.textContent=x.body;card.append(kind,body);if(x.author){const author=document.createElement("div");author.className="pinned-author";author.textContent="— "+x.author;card.append(author)}if(x.url){const link=document.createElement("a");link.className="pinned-link";link.href=x.url;link.target="_blank";link.rel="noopener";link.textContent="مشاهدهٔ پیوند";card.append(link)}el("pinnedEntries").append(card)})}
el("pinned").addEventListener("click",e=>{e.preventDefault();showPinned();history.replaceState(null,"",location.pathname+"#pinned")});
el("backFromPinned").addEventListener("click",()=>{el("pinnedView").hidden=true;el("regularView").hidden=false;history.replaceState(null,"",location.pathname)});
if(location.hash==="#pinned")showPinned();render();
</script></body></html>
