<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171512"><title>یک استکان شعر</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#171512;--panel:#211d19;--panel2:#29231d;--text:#f1e8dc;--muted:#b5a697;--gold:#d5a66f;--line:#40362d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#3a2b20,transparent 55%),var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh}header{text-align:center;padding:48px 18px 26px}header .cup{font-size:38px}h1{font-size:clamp(27px,6vw,38px);font-weight:500;margin:4px 0;color:#f4dfc5}header p{color:var(--muted);margin:8px auto 0;max-width:520px;font-size:14px;line-height:2}main{width:min(900px,100%);margin:auto;padding:0 16px 48px}.search{margin:8px auto 16px;max-width:620px}.search input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:30px;padding:13px 18px;color:var(--text);font:inherit;outline:none}.search input:focus{border-color:var(--gold)}.filters{display:flex;gap:8px;overflow:auto;padding:3px 1px 18px;scrollbar-width:none}.filters button{white-space:nowrap;border:1px solid var(--line);border-radius:22px;background:transparent;color:var(--muted);padding:7px 15px;font:inherit;font-size:13px;cursor:pointer}.filters button.active{background:var(--gold);border-color:var(--gold);color:#21170f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:13px}.poem{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:17px;padding:19px 17px 13px;display:flex;flex-direction:column;min-height:190px}.category{font-size:11px;color:var(--gold);margin-bottom:9px}.verse{white-space:pre-line;text-align:center;line-height:2.2;font-size:15px;font-weight:300;flex:1}.poet{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 5px}.copy{align-self:center;border:0;background:transparent;color:var(--gold);font:inherit;font-size:12px;padding:5px 12px;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:40px 8px}footer{text-align:center;color:#8e7c6b;font-size:12px;padding:10px 15px 30px}
</style></head><body><header><div class="cup">☕</div><h1>یک استکان شعر</h1><p>گاهی یک فنجان چای و چند بیت شعر، حالِ دل را عوض می‌کند…<br>بفرمایید؛ این استکان شعر مهمان شماست.</p></header><main><div class="search"><input id="search" type="search" placeholder="جست‌وجو در شعرها و نام شاعران…" aria-label="جست‌وجو"></div><nav class="filters" id="filters" aria-label="دسته‌بندی شعرها"></nav><section class="grid" id="poems"></section><div class="empty" id="empty" hidden>شعری با این عبارت پیدا نشد.</div></main><footer>یک استکان شعر · برای لحظه‌های مکث و خواندن</footer>
<script>
const categories=["همه","عاشقانه","دلتنگی و انتظار","تنهایی","امید و زندگی","حکمت","طنز و لطافت"];
const poems=[
{c:1,p:"حافظ",t:"اگر آن ترک شیرازی به دست آرد دل ما را\nبه خال هندویش بخشم سمرقند و بخارا را"},
{c:1,p:"سعدی",t:"من از آن روز که در بند توام آزادم\nپادشاهم که به دست تو اسیر افتادم"},
{c:1,p:"مولانا",t:"بی همگان به سر شود، بی تو به سر نمی‌شود\nداغ تو دارد این دلم، جای دگر نمی‌شود"},
{c:1,p:"حافظ",t:"در ازل پرتو حسنت ز تجلی دم زد\nعشق پیدا شد و آتش به همه عالم زد"},
{c:1,p:"سعدی",t:"به جهان خرم از آنم که جهان خرم از اوست\nعاشقم بر همه عالم که همه عالم از اوست"},
{c:2,p:"شهریار",t:"آمدی جانم به قربانت ولی حالا چرا\nبی‌وفا حالا که من افتاده‌ام از پا چرا"},
{c:2,p:"سعدی",t:"شب فراق که داند که تا سحر چند است\nمگر کسی که به زندان عشق دربند است"},
{c:3,p:"مولانا",t:"هر کسی کو دور ماند از اصل خویش\nباز جوید روزگار وصل خویش"},
{c:4,p:"سهراب سپهری",t:"چشم‌ها را باید شست، جور دیگر باید دید\nواژه‌ها را باید شست"},
{c:4,p:"حافظ",t:"یوسف گمگشته بازآید به کنعان غم مخور\nکلبه احزان شود روزی گلستان غم مخور"},
{c:4,p:"خیام",t:"برخیز و مخور غم جهان گذران\nبنشین و دمی به شادمانی گذران"},
{c:5,p:"سعدی",t:"بنی‌آدم اعضای یک پیکرند\nکه در آفرینش ز یک گوهرند"},
{c:5,p:"پروین اعتصامی",t:"قطره‌ای کز جویباری می‌رود\nاز پی انجام کاری می‌رود"},
{c:6,p:"عبید زاکانی",t:"واعظی پرسید از فرزند خویش\nهیچ می‌دانی مسلمانی به چیست؟"}
];
let selected=0;const el=id=>document.getElementById(id);
categories.forEach((name,i)=>{const b=document.createElement("button");b.textContent=name;b.onclick=()=>{selected=i;render()};el("filters").appendChild(b)});
function render(){[...el("filters").children].forEach((b,i)=>b.classList.toggle("active",i===selected));const q=el("search").value.trim().toLocaleLowerCase("fa");const root=el("poems");root.innerHTML="";let count=0;poems.forEach(x=>{if(selected&&x.c!==selected)return;if(q&&!(x.t+" "+x.p+" "+categories[x.c]).toLocaleLowerCase("fa").includes(q))return;count++;const card=document.createElement("article");card.className="poem";const cat=document.createElement("div");cat.className="category";cat.textContent=categories[x.c];const verse=document.createElement("div");verse.className="verse";verse.textContent=x.t;const poet=document.createElement("div");poet.className="poet";poet.textContent="— "+x.p;const btn=document.createElement("button");btn.className="copy";btn.textContent="کپی شعر";btn.onclick=async()=>{try{await navigator.clipboard.writeText(x.t.replaceAll("\\n","\n")+"\n— "+x.p);btn.textContent="کپی شد ✓";setTimeout(()=>btn.textContent="کپی شعر",1300)}catch(e){btn.textContent="امکان کپی نیست"}};card.append(cat,verse,poet,btn);root.appendChild(card)});el("empty").hidden=count!==0}
el("search").addEventListener("input",render);render();
</script></body></html>
